<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="creatureBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f182d"/>
      <stop offset="100%" stop-color="#0a0712"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#creatureBg)"/>

  <!-- Spec Sheet Header -->
  <rect x="40" y="30" width="720" height="60" fill="#161124" stroke="#e11d48" stroke-width="2" rx="8"/>
  <text x="65" y="66" fill="#f43f5e" font-family="sans-serif" font-weight="900" font-size="18">BESTIARY CONCEPT • ABYSSAL DRAGON ANATOMY</text>

  <!-- Central Creature Concept Art Illustration -->
  <g transform="translate(380, 310)">
    <!-- Dragon Body Sinuous Curve -->
    <path d="M -220 140 C -150 40 -80 70 0 30 C 80 -10 160 -40 220 30 C 260 80 200 160 140 180" 
          stroke="#4c0519" stroke-width="65" fill="none" stroke-linecap="round"/>
    <path d="M -220 140 C -150 40 -80 70 0 30 C 80 -10 160 -40 220 30 C 260 80 200 160 140 180" 
          stroke="#e11d48" stroke-width="45" fill="none" stroke-linecap="round"/>
    
    <!-- Dragon Wings -->
    <path d="M 0 30 Q -60 -180 80 -210 Q 140 -90 120 40 Z" fill="#9f1239" opacity="0.8" stroke="#f43f5e" stroke-width="2"/>
    <path d="M 30 20 Q 90 -160 210 -170 Q 230 -60 170 50 Z" fill="#be123c" opacity="0.6" stroke="#fb7185" stroke-width="2"/>
    <!-- Wing Bones -->
    <line x1="0" y1="30" x2="80" y2="-210" stroke="#fecdd3" stroke-width="3"/>
    <line x1="80" y1="-210" x2="10" y2="-90" stroke="#fecdd3" stroke-width="2"/>
    <line x1="80" y1="-210" x2="50" y2="-70" stroke="#fecdd3" stroke-width="2"/>

    <!-- Dragon Horned Head -->
    <polygon points="-220,140 -280,110 -250,165" fill="#be123c"/>
    <!-- Horns -->
    <path d="M -240 120 Q -280 50 -260 20" stroke="#fbbf24" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M -230 130 Q -260 70 -240 40" stroke="#d97706" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Glowing Eye -->
    <circle cx="-250" cy="125" r="5" fill="#fef08a"/>
    <!-- Scales & Spines -->
    
      <polygon points="-120,55 -110,30 -100,55" fill="#fb7185"/>
    
      <polygon points="-70,55 -60,30 -50,55" fill="#fb7185"/>
    
      <polygon points="-20,55 -10,30 0,55" fill="#fb7185"/>
    
      <polygon points="30,10 40,-15 50,10" fill="#fb7185"/>
    
      <polygon points="80,10 90,-15 100,10" fill="#fb7185"/>
    
      <polygon points="130,10 140,-15 150,10" fill="#fb7185"/>
    
  </g>

  <!-- Callout Anatomical Sketches on Left & Right -->
  <g transform="translate(60, 120)">
    <rect width="130" height="110" fill="#140e20" stroke="#64748b" stroke-width="1.5" rx="6"/>
    <text x="65" y="25" fill="#cbd5e1" font-family="sans-serif" font-weight="700" font-size="11" text-anchor="middle">DETALLE DE GARRAS</text>
    <path d="M 40 85 L 65 45 L 90 85" stroke="#f43f5e" stroke-width="4" fill="none"/>
    <path d="M 65 45 L 65 95" stroke="#f43f5e" stroke-width="3"/>
  </g>

  <g transform="translate(60, 260)">
    <rect width="130" height="110" fill="#140e20" stroke="#64748b" stroke-width="1.5" rx="6"/>
    <text x="65" y="25" fill="#cbd5e1" font-family="sans-serif" font-weight="700" font-size="11" text-anchor="middle">ESCAMAS DORSALES</text>
    <polygon points="45,60 65,40 85,60" fill="#e11d48"/>
    <polygon points="55,80 75,60 95,80" fill="#be123c"/>
  </g>

  <g transform="translate(610, 120)">
    <rect width="130" height="220" fill="#140e20" stroke="#64748b" stroke-width="1.5" rx="6"/>
    <text x="65" y="25" fill="#cbd5e1" font-family="sans-serif" font-weight="700" font-size="11" text-anchor="middle">NOTAS BIOLÓGICAS</text>
    <text x="15" y="60" fill="#94a3b8" font-family="sans-serif" font-size="10">• Envergadura: 24m</text>
    <text x="15" y="85" fill="#94a3b8" font-family="sans-serif" font-size="10">• Hábitat: Fosas Abisales</text>
    <text x="15" y="110" fill="#94a3b8" font-family="sans-serif" font-size="10">• Respiración anaeróbica</text>
    <text x="15" y="135" fill="#94a3b8" font-family="sans-serif" font-size="10">• Bioluminiscencia roja</text>
  </g>
</svg>