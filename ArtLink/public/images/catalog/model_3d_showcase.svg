<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="studioLight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a2d3d"/>
      <stop offset="100%" stop-color="#0f1118"/>
    </radialGradient>
    <linearGradient id="metalPbr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="30%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#studioLight)"/>

  <!-- Turntable floor -->
  <ellipse cx="400" cy="510" rx="320" ry="60" fill="#181a24" stroke="#4f46e5" stroke-width="2"/>
  <ellipse cx="400" cy="510" rx="280" ry="50" fill="#12141c" stroke="#6366f1" stroke-dasharray="6,4"/>

  <!-- Left Side: Solid PBR / Right Side: Wireframe Mesh -->
  <!-- Split Line in Middle -->
  <line x1="400" y1="80" x2="400" y2="480" stroke="#06b6d4" stroke-dasharray="4,4" stroke-width="2"/>
  <rect x="360" y="60" width="80" height="24" fill="#0891b2" rx="4"/>
  <text x="400" y="76" fill="#fff" font-family="sans-serif" font-weight="800" font-size="11" text-anchor="middle">PBR | WIRE</text>

  <!-- Left: Solid Shaded Cyber Helmet -->
  <path d="M 400 120 C 310 120 250 180 250 280 C 250 380 320 440 400 460 Z" fill="url(#metalPbr)"/>
  <path d="M 400 220 C 320 220 280 260 280 310 C 330 310 380 290 400 270 Z" fill="#06b6d4" opacity="0.9"/>
  <!-- Cyber Armor Details Left -->
  <path d="M 240 280 L 190 320 L 220 370 L 270 340 Z" fill="#4f46e5" stroke="#818cf8" stroke-width="2"/>
  <circle cx="210" cy="340" r="10" fill="#38bdf8"/>

  <!-- Right: Wireframe Polygons -->
  <g stroke="#06b6d4" stroke-width="1.5" fill="none">
    <path d="M 400 120 C 490 120 550 180 550 280 C 550 380 480 440 400 460"/>
    <!-- Wireframe grid lines -->
    <path d="M 400 150 L 460 170 L 510 220 L 540 280"/>
    <path d="M 400 200 L 480 230 L 530 300 L 520 380"/>
    <path d="M 400 260 L 490 280 L 510 360 L 460 420"/>
    <path d="M 400 320 L 480 340 L 460 410 L 400 460"/>
    <line x1="450" y1="130" x2="450" y2="440"/>
    <line x1="490" y1="160" x2="490" y2="400"/>
    <line x1="530" y1="210" x2="530" y2="350"/>
    <!-- Right side armor pod wireframe -->
    <polygon points="560,280 610,320 580,370 530,340"/>
    <circle cx="590" cy="340" r="10" stroke="#f43f5e"/>
  </g>

  <!-- UI Badges and Info -->
  <rect x="30" y="30" width="220" height="65" fill="#111827" rx="8" stroke="#374151" stroke-width="1.5"/>
  <text x="45" y="55" fill="#f8fafc" font-family="sans-serif" font-weight="900" font-size="15">ZBRUSH &amp; BLENDER 3D</text>
  <text x="45" y="78" fill="#94a3b8" font-family="sans-serif" font-size="12">142K Polys • 4K PBR Textures</text>
  <rect x="700" y="30" width="70" height="30" fill="#10b981" rx="6"/>
  <text x="735" y="50" fill="#fff" font-family="sans-serif" font-weight="800" font-size="12" text-anchor="middle">RIGGED</text>
</svg>