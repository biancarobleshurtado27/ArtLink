<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgLive" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181028"/>
      <stop offset="100%" stop-color="#2d1b4e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgLive)"/>

  <!-- Left: Cubism Hierarchy / Layer Tree -->
  <rect x="40" y="40" width="240" height="520" fill="#130b20" stroke="#7c3aed" stroke-width="2" rx="10"/>
  <text x="60" y="75" fill="#c084fc" font-family="sans-serif" font-weight="900" font-size="16">LIVE2D CUBISM RIG</text>
  
  
    <rect x="55" y="100" width="210" height="34" fill="#201538" rx="5"/>
    <text x="65" y="122" fill="#a855f7" font-family="monospace" font-weight="700" font-size="11">Root_Model_Mesh</text>
  
    <rect x="55" y="142" width="210" height="34" fill="#201538" rx="5"/>
    <text x="65" y="164" fill="#c084fc" font-family="monospace" font-weight="700" font-size="11">├─ Head_Z_Rotation</text>
  
    <rect x="55" y="184" width="210" height="34" fill="#201538" rx="5"/>
    <text x="65" y="206" fill="#38bdf8" font-family="monospace" font-weight="700" font-size="11">│  ├─ Eye_L_Open/Smile</text>
  
    <rect x="55" y="226" width="210" height="34" fill="#201538" rx="5"/>
    <text x="65" y="248" fill="#38bdf8" font-family="monospace" font-weight="700" font-size="11">│  ├─ Eye_R_Open/Smile</text>
  
    <rect x="55" y="268" width="210" height="34" fill="#201538" rx="5"/>
    <text x="65" y="290" fill="#f43f5e" font-family="monospace" font-weight="700" font-size="11">│  ├─ Mouth_Form_A/I/U</text>
  
    <rect x="55" y="310" width="210" height="34" fill="#201538" rx="5"/>
    <text x="65" y="332" fill="#facc15" font-family="monospace" font-weight="700" font-size="11">│  └─ Hair_Physics_Front</text>
  
    <rect x="55" y="352" width="210" height="34" fill="#201538" rx="5"/>
    <text x="65" y="374" fill="#4ade80" font-family="monospace" font-weight="700" font-size="11">├─ Torso_Breath_Motion</text>
  
    <rect x="55" y="394" width="210" height="34" fill="#201538" rx="5"/>
    <text x="65" y="416" fill="#fb923c" font-family="monospace" font-weight="700" font-size="11">├─ Arm_L_Physics</text>
  
    <rect x="55" y="436" width="210" height="34" fill="#201538" rx="5"/>
    <text x="65" y="458" fill="#fb923c" font-family="monospace" font-weight="700" font-size="11">└─ Arm_R_Physics</text>
  

  <!-- Center / Right: Layered Anime Character with Rig Points -->
  <g transform="translate(480, 280)">
    <!-- Base Body Silhouette -->
    <ellipse cx="0" cy="90" rx="60" ry="140" fill="#3b0764" opacity="0.6"/>
    <!-- Head Base -->
    <ellipse cx="0" cy="-60" rx="75" ry="90" fill="#fce7f3"/>
    <!-- Hair Back -->
    <path d="M -90 -90 C -120 60 -70 180 -50 240 C -30 180 -60 30 -60 -40 Z" fill="#a855f7"/>
    <path d="M 90 -90 C 120 60 70 180 50 240 C 30 180 60 30 60 -40 Z" fill="#a855f7"/>
    <!-- Big Anime Eyes with Layer Lines -->
    <ellipse cx="-28" cy="-55" rx="16" ry="24" fill="#1e1b4b"/>
    <circle cx="-24" cy="-60" r="7" fill="#38bdf8"/>
    <circle cx="-28" cy="-50" r="3" fill="#fff"/>
    <ellipse cx="28" cy="-55" rx="16" ry="24" fill="#1e1b4b"/>
    <circle cx="24" cy="-60" r="7" fill="#38bdf8"/>
    <circle cx="28" cy="-50" r="3" fill="#fff"/>
    <!-- Smile -->
    <path d="M -12 -20 Q 0 -10 12 -20" stroke="#f43f5e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Bangs Layer -->
    <path d="M -75 -90 Q -40 -20 -30 -40 Q 0 -10 10 -40 Q 40 -20 75 -90 Z" fill="#c084fc"/>
    <!-- Deformer Mesh Vertex Grid (Cyan overlay) -->
    <g stroke="#06b6d4" stroke-width="1" opacity="0.7">
      
        <line x1="-60" y1="-140" x2="-60" y2="20"/>
      
        <line x1="-30" y1="-140" x2="-30" y2="20"/>
      
        <line x1="0" y1="-140" x2="0" y2="20"/>
      
        <line x1="30" y1="-140" x2="30" y2="20"/>
      
        <line x1="60" y1="-140" x2="60" y2="20"/>
      
      
        <line x1="-70" y1="-140" x2="70" y2="-140"/>
      
        <line x1="-70" y1="-100" x2="70" y2="-100"/>
      
        <line x1="-70" y1="-60" x2="70" y2="-60"/>
      
        <line x1="-70" y1="-20" x2="70" y2="-20"/>
      
        <line x1="-70" y1="20" x2="70" y2="20"/>
      
      <!-- Mesh Control Points -->
      
        <circle cx="-40" cy="-60" r="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
        <circle cx="-40" cy="-20" r="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
      
        <circle cx="0" cy="-60" r="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
        <circle cx="0" cy="-20" r="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
      
        <circle cx="40" cy="-60" r="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
        <circle cx="40" cy="-20" r="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
      
    </g>
  </g>

  <!-- Parameter Sliders on Right -->
  <g transform="translate(680, 100)">
    <text x="0" y="0" fill="#f472b6" font-family="sans-serif" font-weight="800" font-size="12">ANGLE X [-30..30]</text>
    <rect x="0" y="10" width="80" height="6" fill="#374151" rx="3"/>
    <circle cx="55" cy="13" r="7" fill="#ec4899"/>

    <text x="0" y="55" fill="#f472b6" font-family="sans-serif" font-weight="800" font-size="12">EYE OPEN [0..1.0]</text>
    <rect x="0" y="65" width="80" height="6" fill="#374151" rx="3"/>
    <circle cx="70" cy="68" r="7" fill="#ec4899"/>

    <text x="0" y="110" fill="#f472b6" font-family="sans-serif" font-weight="800" font-size="12">HAIR SWAY</text>
    <rect x="0" y="120" width="80" height="6" fill="#374151" rx="3"/>
    <circle cx="40" cy="123" r="7" fill="#ec4899"/>
  </g>
</svg>