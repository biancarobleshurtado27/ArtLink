<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="motionBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="100%" stop-color="#1e1035"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#motionBg)"/>

  <!-- Kinetic Typography Trails & Wave Lines -->
  
    <path d="M -100 550 Q 200 100 850 50" 
