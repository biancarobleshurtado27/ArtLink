  <!-- Geometric Abstract Animated Elements -->
  <g transform="translate(400, 300)">
    <!-- Rotating Rings -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#06b6d4" stroke-width="6" stroke-dasharray="30, 20, 80, 15"/>
    <circle cx="0" cy="0" r="180" fill="none" stroke="#f43f5e" stroke-width="4" stroke-dasharray="60, 40, 10, 30"/>
    <circle cx="0" cy="0" r="90" fill="none" stroke="#facc15" stroke-width="8" stroke-dasharray="40, 15"/>
    <polygon points="0,-70 60,35 -60,35" fill="#7c3aed" opacity="0.8"/>
  </g>

  <!-- Big Kinetic Typography -->
  <text x="400" y="315" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="44" text-anchor="middle" letter-spacing="4">KINETICS</text>
  <text x="400" y="355" fill="#38bdf8" font-family="sans-serif" font-weight="700" font-size="16" text-anchor="middle" letter-spacing="8">MOTION FRAME SEQUENCE</text>

  <!-- Timeline Overlay at Bottom -->
  <g transform="translate(60, 520)">
    <rect width="680" height="40" fill="#111827" rx="8" stroke="#374151" stroke-width="1.5"/>
    <!-- Playhead -->
    <line x1="320" y1="5" x2="320" y2="35" stroke="#ef4444" stroke-width="3"/>
    <polygon points="314,5 326,5 320,12" fill="#ef4444"/>
    <!-- Keyframes -->
    
      <polygon points="40,20 46,26 40,32 34,26" fill="#facc15"/>
    
      <polygon points="120,20 126,26 120,32 114,26" fill="#facc15"/>
    
      <polygon points="210,20 216,26 210,32 204,26" fill="#facc15"/>
    
