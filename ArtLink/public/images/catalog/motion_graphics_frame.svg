      <polygon points="450,20 456,26 450,32 444,26" fill="#facc15"/>
    
      <polygon points="580,20 586,26 580,32 574,26" fill="#facc15"/>
    
      <polygon points="640,20 646,26 640,32 634,26" fill="#facc15"/>
    
    <text x="340" y="25" fill="#9ca3af" font-family="monospace" font-size="12">00:03:14 [60 FPS]</text>
  </g>
