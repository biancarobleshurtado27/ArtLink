      <line x1="270" y1="230" x2="350" y2="115" stroke="#a1a1aa" stroke-width="1.5" opacity="0.6"/>
    
      <line x1="300" y1="0" x2="350" y2="115" stroke="#a1a1aa" stroke-width="1.5" opacity="0.6"/>
      <line x1="300" y1="230" x2="350" y2="115" stroke="#a1a1aa" stroke-width="1.5" opacity="0.6"/>
    
      <line x1="330" y1="0" x2="350" y2="115" stroke="#a1a1aa" stroke-width="1.5" opacity="0.6"/>
