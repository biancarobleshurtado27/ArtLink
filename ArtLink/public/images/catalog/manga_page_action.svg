      <line x1="390" y1="230" x2="350" y2="115" stroke="#a1a1aa" stroke-width="1.5" opacity="0.6"/>
    
      <line x1="420" y1="0" x2="350" y2="115" stroke="#a1a1aa" stroke-width="1.5" opacity="0.6"/>
