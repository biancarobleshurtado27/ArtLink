<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/logo-artlink.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ArtLink centraliza portafolios, precios y disponibilidad de artistas digitales para encargar arte de forma clara y transparente." />
    <meta name="theme-color" content="#FFFDF8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
    <title>ArtLink · Conecta tu arte</title>
  </head>
  <body>
    <!-- Filtros SVG accesibles para modos de Daltonismo -->
    <svg id="artlink-colorblind-filters" xmlns="http://www.w3.org/2000/svg" style="position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none;" aria-hidden="true">
      <defs>
        <!-- Protanopia (Deficiencia de rojo) -->
        <filter id="protanopia-filter" color-interpolation-filters="linearRGB">
          <feColorMatrix
            type="matrix"
            values="0.567 0.433 0     0 0
                    0.558 0.442 0     0 0
                    0     0.242 0.758 0 0
                    0     0     0     1 0" />
        </filter>

        <!-- Deuteranopia (Deficiencia de verde) -->
        <filter id="deuteranopia-filter" color-interpolation-filters="linearRGB">
          <feColorMatrix
            type="matrix"
            values="0.625 0.375 0   0 0
                    0.7   0.3   0   0 0
                    0     0.3   0.7 0 0
                    0     0     0   1 0" />
        </filter>

        <!-- Tritanopia (Deficiencia de azul) -->
        <filter id="tritanopia-filter" color-interpolation-filters="linearRGB">
          <feColorMatrix
            type="matrix"
            values="0.95  0.05  0     0 0
                    0     0.433 0.567 0 0
                    0     0.475 0.525 0 0
                    0     0     0     1 0" />
        </filter>

        <!-- Acromatopsia (Monocromía / Escala de grises) -->
        <filter id="achromatopsia-filter" color-interpolation-filters="linearRGB">
          <feColorMatrix
            type="matrix"
            values="0.299 0.587 0.114 0 0
                    0.299 0.587 0.114 0 0
                    0.299 0.587 0.114 0 0
                    0     0     0     1 0" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
